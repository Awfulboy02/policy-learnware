[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "policy-learnware"
version = "0.1.0"
description = "Offline retrieval and evaluation of frozen reinforcement learning policies"
requires-python = ">=3.10"
dependencies = ["numpy>=1.23", "torch>=1.12"]

[project.optional-dependencies]
am10 = ["jax>=0.4.26"]

[project.scripts]
policy-learnware = "policy_learnware.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
